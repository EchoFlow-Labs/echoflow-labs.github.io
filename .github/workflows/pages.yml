# Deploy the repository root as a static GitHub Pages site (no build step).
# Supply-chain note: third-party actions use official major-version tags (e.g. checkout@v4,
# configure-pages@v5, upload-pages-artifact@v3, deploy-pages@v4) rather than commit SHAs;
# pin SHAs after verifying on github.com when hardening.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build site CSS
        run: npm ci && npm run build

      - name: Validate static site
        run: bash scripts/validate-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
